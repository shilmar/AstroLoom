name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux Qt/OpenGL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xfixes0 libxcb-render-util0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust check, tests & clippy correctness
        run: |
          cargo test --manifest-path astroloom_rs/Cargo.toml --lib --no-run
          cargo clippy --manifest-path astroloom_rs/Cargo.toml --lib -- -D clippy::correctness

      - name: Install Python dependencies & build astroloom_rs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install maturin
          pip install ./astroloom_rs

      - name: Run Python syntax & smoke verification
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python .github/ci/verify_ci.py
