name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install maturin pyinstaller

      - name: Compile Rust native engine (astroloom_rs)
        run: |
          pip install ./astroloom_rs

      - name: Build Executable with PyInstaller (one-dir)
        run: |
          pyinstaller --clean Astroloom.spec

      - name: Compress Windows Portable Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\AstroLoom -DestinationPath dist\AstroLoom-windows-x64-portable.zip

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { '0.0.0-dev' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging\AstroLoom.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: |
            dist/AstroLoom-Setup-x64.exe
            dist/AstroLoom-windows-x64-portable.zip

  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies for Qt and OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xfixes0 libxcb-render-util0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install maturin pyinstaller

      - name: Compile Rust native engine (astroloom_rs)
        run: |
          pip install ./astroloom_rs

      - name: Build Executable with PyInstaller (one-dir)
        run: |
          pyinstaller --clean Astroloom.spec

      - name: Compress Linux Release Archive
        run: |
          chmod +x dist/AstroLoom/AstroLoom
          tar -czvf dist/AstroLoom-linux-x86_64.tar.gz -C dist AstroLoom

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: |
            dist/AstroLoom-linux-x86_64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/AstroLoom-Setup-x64.exe
            release-assets/AstroLoom-windows-x64-portable.zip
            release-assets/AstroLoom-linux-x86_64.tar.gz
          generate_release_notes: true
